<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 118 320 276" width="100%" height="100%">
  <style>
    .mordeczka { transform-origin: 256px 256px; animation: oddech 3.2s ease-in-out infinite; }
    .oko       { transform-origin: 332px 162px; animation: mrugniecie 3.2s ease-in-out infinite; }
    @keyframes oddech {
       0%   { transform: scale(0.94) rotate(-2deg); }
      45%   { transform: scale(1.06) rotate(2deg); }
     100%   { transform: scale(0.94) rotate(-2deg); }
    }
    @keyframes mrugniecie {
       0%, 62%, 100% { transform: scaleY(1); }
      68%            { transform: scaleY(0.08); }
      74%            { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mordeczka, .oko { animation: none; }
    }
  </style>
  <g class="mordeczka" fill="#FFFFFF">
    <path d="M165 170 C180 142 215 142 230 170" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <circle class="oko" cx="332" cy="162" r="20"/>
    <path d="M208 208 C234 244 278 244 304 208" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M120 372 L120 190 L182 190 L256 292 L330 190 L392 190 L392 372 L334 372 L334 270 L274 350 L238 350 L178 270 L178 372 Z"/>
  </g>
</svg>
