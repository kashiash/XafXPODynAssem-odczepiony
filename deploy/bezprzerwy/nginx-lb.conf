# Nginx jako rozdzielacz ruchu miedzy trzy repliki: red, green, blue.
worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/upstream.conf;   # <- tu jest lista replik

    server {
        listen 8090;
        server_name _;
        client_max_body_size 100m;

        location / {
            proxy_pass http://mordeczka;
            proxy_http_version 1.1;
            # Blazor chodzi po WebSockecie — bez tych dwoch naglowkow polaczenie ginie.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # $http_host, a NIE $host: $host gubi numer portu, wiec aplikacja
            # zbudowalaby przekierowanie na logowanie bez portu i przegladarka
            # trafilaby na :80 z bledem ERR_CONNECTION_REFUSED.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 5s;
            # Gdy replika padnie w trakcie, przekaz zadanie nastepnej.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-Kopia $upstream_addr always;
        }
    }
}
