# Nginx jako przelacznik ruchu miedzy dwiema kopiami aplikacji.
# Sam plik sie nie zmienia — zmienia sie tylko upstream.conf, ktory jest wlaczany
# nizej. Dzieki temu przelaczenie to podmiana jednej linii i `nginx -s reload`,
# ktory jest bezprzerwowy: nowe polaczenia ida juz gdzie indziej, a trwajace
# koncza sie na starym procesie.
worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/upstream.conf;   # <- tu siedzi adres aktywnej kopii

    server {
        listen 8090;
        server_name _;
        client_max_body_size 100m;

        location / {
            proxy_pass http://mordeczka;
            proxy_http_version 1.1;
            # Blazor chodzi po WebSockecie — bez tych dwoch naglowkow polaczenie
            # zostanie zerwane i strona bedzie wisiec na banerze.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            # Ktora kopia obsluzyla to zadanie — widac w naglowku odpowiedzi.
            # To jest dowod przelaczenia: w trakcie wdrozenia wartosc zmienia sie
            # z jednego portu na drugi, bez ani jednego bledu po drodze.
            add_header X-Kopia $upstream_addr always;
        }
    }
}
