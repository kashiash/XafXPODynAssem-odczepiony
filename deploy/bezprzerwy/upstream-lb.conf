upstream mordeczka {
    # Blazor wiaze obwod SignalR z KONKRETNYM procesem, wiec klient musi trafiac
    # zawsze do tej samej repliki. Bez ip_hash negocjacja poszlaby na jedna,
    # WebSocket na druga i strona wisialaby na banerze ponownego laczenia.
    ip_hash;
    # max_fails/fail_timeout to bierna kontrola stanu: po dwoch bledach nginx
    # odstawia replike na 15 s i kieruje ruch do pozostalych.
    server 127.0.0.1:8101 max_fails=2 fail_timeout=15s;   # red
    server 127.0.0.1:8102 max_fails=2 fail_timeout=15s;   # green
    server 127.0.0.1:8103 max_fails=2 fail_timeout=15s;   # blue
}
